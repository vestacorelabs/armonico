name: tests

on:
  push:
    branches: [main]
  pull_request:

# Read-only. A pull request from a fork runs this workflow, so nothing here is given
# anything it could take with it.
permissions:
  contents: read

jobs:
  python:
    name: Python tests
    # the image the whole suite was run on; ubuntu-latest is moving to 26.04, whose sudo and
    # coreutils are new Rust versions the device and the lab's Debian do not have
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Install what the lesson engine imports
        run: pip install --require-hashes -r requirements.txt

      # without these the Armonico Pi screen's tests and the bridge's tests are skipped, not run
      - name: Install what the screen's and the bridge's tests need
        run: |
          pip install --require-hashes -r requirements-tests.txt
          sudo apt-get update -qq && sudo apt-get install -y -qq mosquitto mosquitto-clients fonts-dejavu

      # as root: the installer's tests run its functions, which give files to root
      - name: Unit tests
        shell: bash   # given by name, bash runs with pipefail: a failing test still fails the step through tee
        env:
          PYTHONDONTWRITEBYTECODE: "1"   # no root-owned __pycache__ left behind
          SDL_VIDEODRIVER: dummy         # the screen's tests draw with no display
          SDL_AUDIODRIVER: dummy
        # the variables are given to env by name too, so they reach the tests whatever sudo keeps;
        # unbuffered: a test's own prints land where it ran, not all at the end of the log
        run: |
          sudo -E env "PATH=$PATH" PYTHONDONTWRITEBYTECODE=1 PYTHONUNBUFFERED=1 \
            SDL_VIDEODRIVER=dummy SDL_AUDIODRIVER=dummy \
            python3 -m unittest discover -s tests -v 2>&1 | tee "$RUNNER_TEMP/tests.log"

      - name: What failed
        if: failure()
        run: |
          grep -E "^(Ran |FAILED|OK)" "$RUNNER_TEMP/tests.log" || true
          awk '/^(FAIL|ERROR): /{p=1} /^Ran [0-9]+ test/{p=0} p' "$RUNNER_TEMP/tests.log" | tail -n 300

      - name: What was skipped, and why
        if: always()
        run: |
          echo "skipped: $(grep -c "skipped '" "$RUNNER_TEMP/tests.log" || true)"
          grep -o "skipped '.*'" "$RUNNER_TEMP/tests.log" | sort | uniq -c | sort -rn || true

      - name: Every Python file parses
        env:
          PYTHONPYCACHEPREFIX: ${{ runner.temp }}/pycache
        run: |
          python3 -m compileall -q lessons cli setup bridge device android/app/src/main/python

  shell:
    name: Shell scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Syntax
        run: |
          for f in install.sh setup/update.sh setup/make-release.sh bridge/*.sh; do
            bash -n "$f" || exit 1
          done

      - name: shellcheck
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
          # SC1090: the settings file is read by a path only known when the script runs
          shellcheck -S warning -e SC1090 install.sh setup/update.sh setup/make-release.sh bridge/*.sh device/*.sh

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - name: pip-audit
        run: |
          pip install pip-audit
          pip-audit -r requirements.txt --strict

  release-files:
    name: The files a release must carry
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Present and accounted for
        run: |
          for f in LICENSE NOTICE SECURITY.md CONTRIBUTING.md README.md CHANGELOG.md \
                   VERSION lessons/fonts/OFL.txt lessons/sounds/piano/SOURCE.md device/samples/SOURCE.md \
                   device/samples/gm/SOURCE.md; do
            [ -s "$f" ] || { echo "missing or empty: $f"; exit 1; }
          done
      - name: The version and the changelog agree
        run: |
          v="$(tr -d '[:space:]' < VERSION)"
          grep -q "^## $v\$" CHANGELOG.md || { echo "CHANGELOG.md has no section for $v"; exit 1; }
