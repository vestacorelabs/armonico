name: android

# Builds the Android app (android/) into an APK. It runs when something the app is built from
# changes, by hand from the Actions tab ("Run workflow"), and when a release is published: then
# the APK is attached to the release, where the app's update check finds it, as an installation
# on Linux finds the archive there.
on:
  release:
    types: [published]
  push:
    branches: [main]
    paths:
      - "android/**"
      - "VERSION"
      - "lessons/piano_lang.py"
      - "setup/music/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: read           # only the job that attaches the APK to a release may write

jobs:
  apk:
    name: APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "17"

      # Chaquopy installs the app's Python packages with a Python of the same version as the app's
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"

      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4

      - name: Build
        working-directory: android
        env:
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_B64" ]; then
            # a release must be signed with the release key, or it would not install over the last one
            if [ "${{ github.event_name }}" != "push" ]; then
              echo "::error::No signing secrets: an APK for the release is not built with a debug key"; exit 1
            fi
            echo "::warning::No signing secrets: the APK is signed with a debug key and will not install over an earlier build"
          fi
          ./gradlew assembleRelease --no-daemon

      - name: Name the APK
        run: |
          v=$(cat VERSION)
          mkdir -p out
          cp android/app/build/outputs/apk/release/app-release.apk "out/armonico-android-$v-${{ github.run_number }}.apk"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: armonico-android
          path: out/*.apk
          retention-days: 30

  attach:
    name: Attach to the release
    needs: apk
    # on a published release, and when run by hand (Actions › android › Run workflow): then the APK goes
    # on the release of this version (v + VERSION), which has to exist already
    if: github.event_name == 'release' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: armonico-android
          path: out

      - name: Upload
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
          RUN: ${{ github.run_number }}
        run: |
          v=$(cat VERSION)
          [ -n "$TAG" ] || TAG="v$v"
          gh release view "$TAG" >/dev/null || { echo "::error::No release $TAG to put the APK on"; exit 1; }
          cp "out/armonico-android-$v-$RUN.apk" "out/armonico-android-$v.apk"
          gh release upload "$TAG" "out/armonico-android-$v.apk" --clobber
