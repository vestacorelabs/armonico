# Armonico Pi: PipeWire for a piano. Installed by install.sh --device as
# /etc/pipewire/pipewire.conf.d/80-armonico.conf, removed with it.

# Short buffers, so a key sounds right away: 512 frames at 48 kHz are about 11 ms.
context.properties = {
    default.clock.rate        = 48000
    default.clock.quantum     = 512
    default.clock.min-quantum = 256
}

# HDMI off (DSI only): the "AUX + HDMI" output below is kept as a comment. The device runs on its own
# DSI screen, the BIGTREETECH PiTFT50 the case is built for, and plays no sound on HDMI.
# "AUX + HDMI": one output that plays into the Pi's own sound outputs at once (platform-*),
# never into a USB sound device, which plays only when chosen on the screen.
