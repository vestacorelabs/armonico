# Armonico Pi: pipewire-pulse for the rest video. Installed by install.sh --device as
# /etc/pipewire/pipewire-pulse.conf.d/80-armonico.conf, removed with it.

# While the rest video plays, the whole sound graph runs in blocks of 2048 frames (about 43 ms)
# instead of 512. The AUX output gets its sound through the Pi's firmware, whose position moves
# only about every 10 ms; on 512-frame blocks the video jumped, while the same soundtrack played
# with pw-play, which asks for large blocks, was clean (measured on the Pi). node.force-quantum
# holds only while the video's stream is active (pipewire-props(7)): a key stops the video, the
# stream goes, and the keys are back on 512-frame blocks. device/screen.py also asks for it in the
# stream's own properties.
# While a Bluetooth output plays, device/ui/audio.py (hold_quantum) holds the graph on 512 frames with the
# setting clock.force-quantum, which overrides this: a Bluetooth output that is playing when the quantum
# changes goes silent until it connects again.
stream.rules = [
    {
        matches = [ { application.name = "Armonico video" } ]
        actions = { update-props = { node.force-quantum = 2048, state.restore-props = false, state.restore-target = false } }
    }
]
