# Armonico Pi: Wi-Fi power saving off. Installed by install.sh --device as
# /etc/NetworkManager/conf.d/80-armonico-wifi.conf, removed with it.
#
# The Pi's Wi-Fi and Bluetooth are one chip (CYW43455) with one antenna. With power saving on, the Wi-Fi side keeps
# going to sleep and waking, and the Bluetooth sound shares its time with that. Off costs a little more power.
# 2 = disable (NetworkManager's setting wifi.powersave: 0 default, 1 ignore, 2 disable, 3 enable).
[connection]
wifi.powersave = 2
