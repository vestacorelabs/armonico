# Armonico Pi: WirePlumber without a desktop. Installed by install.sh --device as
# /etc/wireplumber/wireplumber.conf.d/80-armonico.conf, removed with it.
# The sound cards are used whether or not a desktop session is in front: the keys play from a
# service, before and after the screen's session.

# A sound card seen for the first time starts at full level, not at WirePlumber's 40% on the
# cubic scale (0.064, about -24 dB), which made the small speakers sound faint and muffled.
# The level heard is then set by the device's own volume (Settings › Volume).
wireplumber.settings = {
  device.routes.default-sink-volume = 1.0
  # A Bluetooth headset is never moved to its headset profile (HSP/HFP) when something records: that profile
  # is mono and narrow-band, and a recording through a USB microphone must leave the headphones on A2DP.
  # WirePlumber's setting bluetooth.autoswitch-to-headset-profile is on by default.
  bluetooth.autoswitch-to-headset-profile = false
  # No stream gets back the volume, mute or output it had last time. The device sets every level itself (Settings ›
  # Volume), and the rest video fades its own stream to 0 before it closes (no click): restored, that 0 came back on
  # the next start of the video, and on every loop that opened it again, and the video stayed silent. A stream also
  # follows the default output only, never an output it was moved to once (a mix or a Bluetooth device now gone).
  node.stream.restore-props = false
  node.stream.restore-target = false
}

wireplumber.profiles = {
  main = {
    support.logind = disabled
  }
}

monitor.bluez.rules = [
  # A Bluetooth output stays open, as the ALSA ones do below. By default an idle node is suspended after a few
  # seconds, and a suspended A2DP link has to be started again, which cut the first notes after a pause.
  {
    matches = [ { node.name = "~bluez_output.*" } ]
    actions = { update-props = { session.suspend-timeout-seconds = 0 } }
  }
  # A Bluetooth output with a buffer of about 21 ms (1024 frames at 48 kHz). It was 8192 (about 170 ms), against
  # dropouts when the Pi's Wi-Fi and Bluetooth, one chip and one antenna, both used 2.4 GHz: measured on the
  # device (pw-top) the Bluetooth output held all of it while the keys came in blocks of 512, so every key on
  # Bluetooth was heard about 170 ms late, on top of what the headphones and SBC add themselves. Measured again
  # with the Wi-Fi on 5 GHz (-44 dBm), 3 networks on 2.4 GHz around, no USB 3 device, no under-voltage: 1024
  # played with no errors (ERR 0). Wi-Fi power saving is off as well (80-armonico-wifi.conf), so the shared chip
  # does not keep sleeping and waking under the Bluetooth.
  {
    matches = [ { node.name = "~bluez_output.*" } ]
    actions = { update-props = { node.latency = "1024/48000" } }
  }
]

monitor.alsa.rules = [
  # Every output stays open. By default an idle output closes after 5 seconds, and opening it again
  # (above all HDMI, where the screen also has to find the sound again) delayed or cut the first
  # notes after a pause.
  {
    matches = [ { node.name = "~alsa_output.*" } ]
    actions = { update-props = { session.suspend-timeout-seconds = 0 } }
  }
  # HDMI off (DSI only): the Pi's HDMI sound cards are not used at all. The device runs on its own DSI
  # screen, the BIGTREETECH PiTFT50 the case is built for. Remove this rule to have HDMI sound again.
  {
    matches = [ { device.name = "~alsa_card.*hdmi.*" } ]
    actions = { update-props = { device.disabled = true } }
  }
  # HDMI off (DSI only):
  # HDMI with a longer buffer: on short periods the Pi's HDMI sound ran dry whenever the processor
  # was busy (drawing, video), which sounded torn and harsh. About 20 ms more on HDMI only.
  # {
  #   matches = [ { node.name = "~alsa_output.*hdmi.*" } ]
  #   actions = { update-props = { api.alsa.period-size = 1024, api.alsa.headroom = 1024 } }
  # }
  # The AUX jack (bcm2835 Headphones) with software volume only. With its hardware mixer in use,
  # PipeWire put "100%" at the top of that mixer, +4 dB, where the jack distorts and sounds harsh,
  # whatever the installer had set. Now the mixer stays at the 0 dB the installer sets and is left alone.
  {
    matches = [ { device.name = "~alsa_card.*bcm2835.*" }, { api.alsa.card.name = "~.*Headphones.*" } ]
    actions = { update-props = { api.alsa.soft-mixer = true } }
  }
  # The AUX output with the longer buffer HDMI has. The Pi sends that sound through the firmware
  # (fe00b840.mailbox), whose driver moves its position only on the GPU's notices, about every 10 ms
  # (drivers/staging/vc04_services/bcm2835-audio, a batch device); on its 480 frames of headroom the
  # output still ran dry about once a minute, heard as a jump. Measured on the Pi: with these values
  # (PipeWire makes them 512 and 1536) the video sounded clear and the keys still answered at once.
  # AUX also leads the graph whenever it plays with another card (AUX + USB, a recording): a follower is
  # paced by the leader's clock and has to read its own position exactly, which this batch device, moving
  # only every 10 ms, cannot. Under a USB headset (driver priority 1008, its microphone 2009) AUX ran dry
  # 21 times in a few minutes (pw-top ERR) while the headset had none; a USB card reports its position
  # every 1 ms and follows well.
  {
    matches = [ { node.name = "~alsa_output.*mailbox.*" }, { node.name = "~alsa_output.*bcm2835.*" } ]
    actions = { update-props = { api.alsa.period-size = 1024, api.alsa.headroom = 1024, priority.driver = 2100 } }
  }
]
